  <path d="M397 262c0 91-65 148-149 148-93 0-166-70-166-163 0-91 70-163 165-163 56 0 105 24 136 63" fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round"/>
  <path d="M395 262h-118" fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round"/>
  <path d="m352 208 54 54-54 54" fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 214c20-57 75-96 135-96 43 0 82 18 110 47" fill="none" stroke="url(#highlight)" stroke-width="8" stroke-linecap="round"/>
